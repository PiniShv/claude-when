<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When: every message, with its time</title>
<link rel="stylesheet" href="when-sim.css">
<style>
  :root { --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .stage { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; margin: 0 auto; position: relative; top: 50%; transform: translateY(-50%);
    container-type: inline-size; display: grid; grid-template-rows: 1fr auto; justify-items: center; padding: 3.4cqw 0 3cqw; gap: 2.4cqw; }
  .win { width: 66cqw; min-height: 0; height: 100%; }
  h1 { margin: 0; font: 400 3.1cqw/1.1 var(--font-text); letter-spacing: -.022em; font-weight: 600; color: #f5f5f7; }
  h1 span { color: #86868b; }
</style>
</head>
<body>
<div class="stage">
  <div class="win" data-sim-host><div data-sim="once" data-k="1.8" data-fixed></div></div>
  <h1><span>Every message.</span> With its time.</h1>
</div>
<script src="when-sim.js"></script>
</body>
</html>
